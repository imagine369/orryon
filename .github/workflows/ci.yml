name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Core layering (no core/ → backend/ imports)
        run: ./scripts/check_core_layering.sh

      - name: File length guard (warn >400, fail >500)
        run: ./scripts/check_file_length.sh

      - name: Pytest
        env:
          NODE_ENV: development
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          REQUEST_SIGNING_MODE: "off"
        run: pytest tests/ -q

      - name: Smoke script
        env:
          NODE_ENV: development
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          REQUEST_SIGNING_MODE: "off"
        run: python scripts/smoke_test.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orryon
          POSTGRES_PASSWORD: orryon
          POSTGRES_DB: orryon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Pytest (Postgres dialect)
        env:
          NODE_ENV: development
          JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
          REQUEST_SIGNING_MODE: "off"
          DATABASE_URL: postgresql://orryon:orryon@localhost:5432/orryon_test
        run: pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint, test, and build
        working-directory: frontend
        env:
          # Placeholders so Next.js build succeeds without real secrets in CI
          JWT_SECRET: ci-build-jwt-secret-minimum-32-characters-long
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
