## Render deployment — FastAPI backend (primary)
##
## Deploy the frontend (Next.js) separately on Render or Vercel.
## Set NEXT_PUBLIC_API_URL on the frontend to point to this backend's URL.

services:
  - type: web
    name: orryon-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/finance.db
      - key: GROK_MODEL
        value: grok-3-mini
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    disk:
      name: orryon-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /api/health
